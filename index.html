<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #14110F;
      color: #F5EBE0;
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      padding: 1.5rem 1.5rem 0.5rem;
      font-size: 2rem;
      font-weight: bold;
      color: #F7D08A;
    }

    .auth-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }

    .sync-status {
      background-color: #231C18;
      color: #F7D08A;
      border: 1px solid #3A2E27;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .login-card {
      max-width: 360px;
      margin: 3rem auto;
      background-color: #231C18;
      border: 1px solid #3A2E27;
      padding: 1.5rem;
      border-radius: 15px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .login-card input {
      background-color: #14110F;
      border: 1px solid #3A2E27;
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font-family: inherit;
      font-size: 1rem;
      color: #F5EBE0;
      outline: none;
    }

    .login-card input:focus {
      border-color: #E09F3E;
    }

    .login-error {
      color: #FF8A80;
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    .date-section {
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }

    input[type="date"] {
      background-color: #231C18;
      color: #F5EBE0;
      border: 1px solid #3A2E27;
      border-radius: 8px;
      padding: 0.4rem 0.7rem;
      font-family: inherit;
      font-size: 1rem;
      color-scheme: dark;
      outline: none;
    }

    input[type="date"]:focus {
      border-color: #E09F3E;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      padding: 1rem;
    }

    .column {
      background-color: #231C18;
      border: 1px solid #3A2E27;
      padding: 1rem;
      border-radius: 15px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      flex: 1 1 300px;
      min-width: 280px;
      transition: transform 0.3s ease;
    }

    .column:hover {
      transform: scale(1.02);
    }

    h2 {
      text-align: center;
      margin-bottom: 0.5rem;
      color: #F7D08A;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin: 0.5rem 0;
      display: flex;
      align-items: center;
      background-color: #2E241E;
      border: 1px solid #3D3028;
      padding: 0.5rem 0.75rem;
      border-radius: 10px;
      transition: background-color 0.3s;
    }

    li.completed {
      text-decoration: line-through;
      opacity: 0.55;
    }

    input[type="checkbox"] {
      margin-right: 0.75rem;
      accent-color: #E09F3E;
    }

    input[type="text"] {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 1rem;
      color: #F5EBE0;
      font-family: inherit;
    }

    input[type="text"]::placeholder {
      color: #9E8B7B;
    }

    button {
      background-color: #E09F3E;
      color: #14110F;
      border: none;
      padding: 0.5rem 1rem;
      margin-top: 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #FFC857;
    }

    .auth-bar button {
      margin-top: 0;
      padding: 0.35rem 0.75rem;
      font-size: 0.85rem;
    }

    .centered-button {
      display: flex;
      justify-content: center;
      margin: 2rem auto;
    }

    .me-section {
      max-width: 1000px;
      margin: 0 auto;
      margin-top: 1rem;
    }

    .study-section {
      max-width: 1000px;
      margin: 0 auto;
      margin-bottom: 1rem;
    }

    .study-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    #study ul {
      padding: 0;
      list-style: none;
      display: contents;
    }
  </style>
</head>

<body>
  <header>To-Do List</header>

  <div id="login-view" class="login-card">
    <h2 style="margin-top: 0;">Sign In</h2>
    <input type="email" id="login-email" placeholder="Your email" autocomplete="email" />
    <input type="password" id="login-password" placeholder="Your password" autocomplete="current-password" />
    <button id="login-btn" type="button">Sign In &amp; Sync</button>
    <div id="login-error" class="login-error"></div>
  </div>

  <div id="app-view" style="display: none;">
    <div class="auth-bar">
      <span id="sync-status" class="sync-status">Synced</span>
      <button id="logout-btn" type="button">Sign Out</button>
    </div>

    <div class="date-section">
      <input type="date" id="dateInput" />
    </div>

    <div class="container">
      <div class="column" id="office">
        <h2>Other Tasks</h2>
        <ul></ul>
        <button onclick="addTask('office')">+ Add Task</button>
        <button onclick="clearSelected('office')">🧹 Clear Selected</button>
      </div>

      <div class="column" id="home">
        <h2>Home Tasks</h2>
        <ul></ul>
        <button onclick="addTask('home')">+ Add Task</button>
        <button onclick="clearSelected('home')">🧹 Clear Selected</button>
      </div>
    </div>

    <div class="study-section">
      <div class="column" id="study">
        <h2>Study 📘</h2>
        <div class="study-grid">
          <ul></ul>
        </div>
        <button onclick="addTask('study')">+ Add Task</button>
        <button onclick="clearSelected('study')">🧹 Clear Selected</button>
      </div>
    </div>

    <div class="me-section">
      <div class="column" id="me">
        <h2>To finish today 💖</h2>
        <ul></ul>
        <button onclick="addTask('me')">+ Add Task</button>
        <button onclick="clearSelected('me')">🧹 Clear Selected</button>
      </div>
    </div>

    <div class="centered-button">
      <button onclick="resetTasks()">🔄 Daily Reset</button>
    </div>
  </div>

  <canvas id="confetti-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999;"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjAgIXbfKwApYcP0OMcXKp06B1ZC6mjjk",
      authDomain: "personal-todo-sync-1baef.firebaseapp.com",
      projectId: "personal-todo-sync-1baef",
      storageBucket: "personal-todo-sync-1baef.firebasestorage.app",
      messagingSenderId: "1049871009058",
      appId: "1:1049871009058:web:81b209b4892cecb60bd17b",
      measurementId: "G-8WGSTZ2G1Y"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const sections = ['office', 'home', 'me', 'study'];
    let currentUser = null;
    let unsubscribeSnapshot = null;
    let isApplyingRemoteUpdate = false;
    let saveTimer = null;

    const loginView = document.getElementById('login-view');
    const appView = document.getElementById('app-view');
    const loginEmail = document.getElementById('login-email');
    const loginPassword = document.getElementById('login-password');
    const loginBtn = document.getElementById('login-btn');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout-btn');
    const syncStatus = document.getElementById('sync-status');
    const dateInput = document.getElementById('dateInput');

    function setStatus(text) {
      syncStatus.textContent = text;
    }

    function createTaskRow(task = { text: '', completed: false }) {
      const li = document.createElement('li');
      if (task.completed) li.classList.add('completed');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = Boolean(task.completed);
      checkbox.onchange = handleCheck;

      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Enter your task';
      input.value = task.text || '';
      input.oninput = () => scheduleSave();

      li.appendChild(checkbox);
      li.appendChild(input);
      return li;
    }

    window.addTask = function addTask(section, skipSave = false) {
      const ul = document.querySelector(`#${section} ul`);
      ul.appendChild(createTaskRow());
      if (!skipSave) saveTasks();
    };

    window.handleCheck = function handleCheck(e) {
      const li = e.target.closest('li');
      li.classList.toggle('completed');
      if (e.target.checked) {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
      saveTasks();
    };

    window.clearSelected = function clearSelected(section) {
      const ul = document.querySelector(`#${section} ul`);
      ul.querySelectorAll('li').forEach(li => {
        if (li.querySelector('input[type="checkbox"]').checked) {
          li.remove();
        }
      });
      saveTasks();
    };

    window.resetTasks = function resetTasks() {
      sections.forEach(section => {
        const ul = document.querySelector(`#${section} ul`);
        ul.innerHTML = '';
        for (let i = 0; i < 5; i++) addTask(section, true);
      });
      saveTasks();
    };

    function collectCurrentState() {
      const data = {};
      sections.forEach(section => {
        const tasks = [];
        document.querySelectorAll(`#${section} ul li`).forEach(li => {
          tasks.push({
            text: li.querySelector('input[type="text"]').value,
            completed: li.classList.contains('completed')
          });
        });
        data[section] = tasks;
      });
      return {
        date: dateInput.value,
        sections: data,
        updatedAt: Date.now()
      };
    }

    function renderState(payload) {
      isApplyingRemoteUpdate = true;
      try {
        if (payload?.date) {
          dateInput.value = payload.date;
        } else if (!dateInput.value) {
          dateInput.value = new Date().toISOString().split('T')[0];
        }

        const sectionData = payload?.sections || {};
        sections.forEach(section => {
          const ul = document.querySelector(`#${section} ul`);
          ul.innerHTML = '';
          const items = sectionData[section] || [];
          items.forEach(task => ul.appendChild(createTaskRow(task)));
          for (let i = items.length; i < 5; i++) {
            addTask(section, true);
          }
        });
      } finally {
        isApplyingRemoteUpdate = false;
      }
    }

    function scheduleSave() {
      if (isApplyingRemoteUpdate) return;
      const state = collectCurrentState();
      localStorage.setItem('todoData', JSON.stringify(state));
      setStatus('Saving...');

      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        pushToCloud(state);
      }, 400);
    }

    async function pushToCloud(state) {
      if (!currentUser) return;
      try {
        const userDocRef = doc(db, 'users', currentUser.uid, 'todo', 'current');
        await setDoc(userDocRef, state, { merge: true });
        setStatus('Synced');
      } catch (err) {
        console.error(err);
        setStatus('Offline / Retry');
      }
    }

    window.saveTasks = function saveTasks() {
      scheduleSave();
    };

    dateInput.addEventListener('change', () => scheduleSave());

    loginBtn.addEventListener('click', async () => {
      loginError.textContent = '';
      try {
        await signInWithEmailAndPassword(auth, loginEmail.value.trim(), loginPassword.value);
      } catch (err) {
        loginError.textContent = 'Sign-in failed. Check your email and password.';
      }
    });

    logoutBtn.addEventListener('click', async () => {
      if (unsubscribeSnapshot) {
        unsubscribeSnapshot();
        unsubscribeSnapshot = null;
      }
      await signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (unsubscribeSnapshot) {
        unsubscribeSnapshot();
        unsubscribeSnapshot = null;
      }

      if (!user) {
        loginView.style.display = 'flex';
        appView.style.display = 'none';
        return;
      }

      loginView.style.display = 'none';
      appView.style.display = 'block';

      const cached = JSON.parse(localStorage.getItem('todoData') || 'null');
      if (cached) {
        renderState(cached);
      } else {
        renderState({ date: new Date().toISOString().split('T')[0], sections: {} });
      }

      const userDocRef = doc(db, 'users', user.uid, 'todo', 'current');
      setStatus('Connecting...');

      unsubscribeSnapshot = onSnapshot(userDocRef, (snapshot) => {
        if (snapshot.exists()) {
          const remoteData = snapshot.data();
          const localData = JSON.parse(localStorage.getItem('todoData') || 'null');
          if (!localData || (remoteData.updatedAt || 0) >= (localData.updatedAt || 0)) {
            localStorage.setItem('todoData', JSON.stringify(remoteData));
            renderState(remoteData);
          }
          setStatus('Synced');
        } else {
          const initial = collectCurrentState();
          pushToCloud(initial);
        }
      }, (err) => {
        console.error(err);
        setStatus('Sync error');
      });
    });
  </script>
</body>

</html>
